version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=mock
      - DEBATE_ROUNDS=3
      - RATE_LIMIT=60
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./src:/app/src
    command: >
      sh -c "pip install --quiet streamlit httpx &&
             streamlit run /app/src/frontend.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy

  # 数据库（Sprint 2 起启用，当前预留）
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=foodie
      - POSTGRES_PASSWORD=foodie
      - POSTGRES_DB=foodie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
