version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=mock
      - DEBATE_ROUNDS=3
      - RATE_LIMIT=60
      - DATABASE_URL=sqlite:////app/data/cyber_foodie.db
    volumes:
      - foodie_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  foodie_data:
