name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 静态检查（flake8）
        run: |
          pip install flake8
          flake8 src tests --max-line-length=100 --extend-ignore=E203,W503

      - name: 单元测试 + 集成测试 + BDD 测试（覆盖率）
        run: |
          pytest tests/unit tests/integration tests/bdd \
            --cov=src --cov-report=term-missing \
            --cov-fail-under=75

      - name: 数据库迁移验证（Alembic）
        run: |
          DATABASE_URL=sqlite:///./ci_migrate.db alembic upgrade head

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Docker Compose（后端 + 前端）
        run: docker compose build
